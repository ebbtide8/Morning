<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e0f2fe">
  <title>Morning Information</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    /* =========================================
       カラー＆質感定義（朝の澄んだ空・半透明ガラス風）
       ========================================= */
    :root {
      --bg-sky: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 45%, #fdf2f8 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-bg-sub: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 8px 24px -4px rgba(14, 116, 144, 0.07), 0 2px 6px -1px rgba(14, 116, 144, 0.04);

      --text-main: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --accent-sky: #0284c7;
      --accent-sky-soft: rgba(2, 132, 199, 0.1);

      --accent-green: #059669;
      --accent-green-soft: rgba(16, 185, 129, 0.12);
      --accent-green-border: rgba(16, 185, 129, 0.35);

      --accent-pink: #db2777;
      --accent-pink-soft: rgba(244, 114, 182, 0.13);
      --accent-pink-border: rgba(244, 114, 182, 0.35);

      --accent-alert: #dc2626;
      --accent-alert-soft: rgba(254, 226, 226, 0.85);
    }

    /* =========================================
       ベースレイアウト＆タイポグラフィ
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg-sky);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .num {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    /* =========================================
       ヘッダー
       ========================================= */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 22px;
      padding: 0 4px 12px;
      border-bottom: 1px solid rgba(2, 132, 199, 0.15);
    }

    .header-subtitle {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent-sky);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .header-date {
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .header-date span {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--accent-pink);
      margin-left: 6px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .sync-badge.is-loading::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-sky);
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--accent-sky);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.06);
      transition: all 0.2s ease;
    }

    .btn-refresh:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .btn-refresh:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* 日付跨ぎキャッシュ表示時の控えめな通知バー */
    .stale-banner {
      display: none;
      margin-bottom: 14px;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--accent-pink-soft);
      border: 1px solid var(--accent-pink-border);
      color: var(--accent-pink);
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* =========================================
       CSS Grid ダッシュボード構造
       ========================================= */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .card-title svg {
      width: 15px;
      height: 15px;
      stroke: var(--accent-sky);
      stroke-width: 1.8;
      fill: none;
    }

    .span-12 { grid-column: span 12; }
    .span-7  { grid-column: span 7; }
    .span-5  { grid-column: span 5; }

    @media (max-width: 768px) {
      .span-7, .span-5 {
        grid-column: span 12;
      }
      .container {
        padding: 16px 14px 32px;
      }
    }

    /* =========================================
       Tier 1：鉄道運行情報 ＆ 天気・洗濯指数
       ========================================= */
    .transit-card {
      padding: 13px 20px;
      border-left: 4px solid var(--accent-green);
      background: linear-gradient(90deg, rgba(236, 253, 245, 0.82) 0%, rgba(255, 255, 255, 0.72) 100%);
    }

    .transit-card.is-delayed {
      border-left-color: var(--accent-alert);
      background: var(--accent-alert-soft);
    }

    .transit-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .transit-route {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .transit-status {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-green);
    }

    .transit-card.is-delayed .transit-status {
      color: var(--accent-alert);
    }
    .transit-card.is-delayed .status-dot {
      background-color: var(--accent-alert);
    }

    /* 天気・洗濯指数 */
    .weather-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .weather-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--accent-sky-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-sky);
    }

    .weather-icon-wrap svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 1.6;
      fill: none;
    }

    .weather-temp {
      font-size: 2.15rem;
      font-weight: 300;
      color: var(--text-main);
      line-height: 1.1;
    }

    .weather-temp small {
      font-size: 1rem;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .weather-detail {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .laundry-box {
      background: var(--accent-green-soft);
      border: 1px solid var(--accent-green-border);
      border-radius: 12px;
      padding: 11px 16px;
      min-width: 200px;
      transition: background 0.2s, border-color 0.2s;
    }

    .laundry-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--accent-green);
      margin-bottom: 2px;
    }

    .laundry-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* =========================================
       Tier 2：今日の予定 ＆ タスク
       ========================================= */
    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-list li {
      padding: 9px 12px;
      background: var(--glass-bg-sub);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      font-size: 0.88rem;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .empty-msg {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 6px 2px;
    }

    .time-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-sky);
      min-width: 44px;
    }

    .todo-item {
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .todo-item:hover {
      background: rgba(255, 255, 255, 0.85);
    }
    .todo-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--accent-sky);
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      position: relative;
      top: 2px;
      flex-shrink: 0;
    }
    .todo-item input[type="checkbox"]:checked {
      background: var(--accent-sky);
    }
    .todo-item input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid #ffffff;
      border-width: 0 1.8px 1.8px 0;
      transform: rotate(45deg);
    }
    .todo-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* =========================================
       Tier 3：銭湯定休日 ＆ TV・ラジオ番組
       ========================================= */
    .sento-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sento-badge {
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--accent-pink-soft);
      color: var(--accent-pink);
      border: 1px solid var(--accent-pink-border);
    }

    .sento-open-msg {
      font-size: 0.86rem;
      color: var(--accent-green);
      font-weight: 500;
      padding: 6px 0;
    }

    .media-station {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 5px;
      background: var(--accent-sky-soft);
      color: var(--accent-sky);
      font-weight: 600;
      white-space: nowrap;
    }

    /* =========================================
       Tier 4：おもなニュース ＆ 今日は何の日
       ========================================= */
    .news-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .news-list li {
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    .news-list li:last-child {
      border-bottom: none;
    }

    .news-list a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      display: block;
      padding: 9px 2px;
      transition: color 0.15s ease;
    }

    .news-list a:hover {
      color: var(--accent-sky);
    }

    .anniversary-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-size: 0.8rem;
      color: var(--text-secondary);
      background: var(--glass-bg-sub);
      border: 1px solid rgba(255, 255, 255, 0.85);
      padding: 5px 12px;
      border-radius: 8px;
    }
    .tag.highlight {
      background: var(--accent-pink-soft);
      color: var(--accent-pink);
      border-color: var(--accent-pink-border);
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <header class="app-header">
    <div>
      <div class="header-subtitle">Morning Briefing</div>
      <h1 class="header-date num" id="current-date">--月--日<span>---</span></h1>
    </div>
    <div class="header-meta">
      <span class="sync-badge num" id="sync-status">準備中</span>
      <button class="btn-refresh" id="refresh-btn" title="最新情報を取得">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        更新
      </button>
    </div>
  </header>

  <div class="stale-banner" id="stale-banner">
    前回のデータを表示しています。最新の予定とニュースを取得中です...
  </div>

  <main class="dashboard-grid">

    <!-- =====================================
         Tier 1: 鉄道運行情報 ＆ 天気・洗濯指数
         ===================================== -->
    <section class="card span-12 transit-card" id="transit-card">
      <div class="transit-row">
        <div class="transit-route">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><path d="M8 15h.01"/><path d="M16 15h.01"/></svg>
          <span id="transit-route-name">通勤路線 運行状況</span>
        </div>
        <div class="transit-status" id="transit-status">
          <span class="status-dot"></span>
          <span>確認中...</span>
        </div>
      </div>
    </section>

    <section class="card span-12">
      <div class="card-header">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          今日の天気・洗濯指数
        </h2>
        <span class="weather-detail" id="weather-location">現在地を取得中</span>
      </div>
      <div class="weather-body">
        <div class="weather-main">
          <div class="weather-icon-wrap" id="weather-icon">
            <svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
          </div>
          <div>
            <div class="weather-temp num" id="weather-temp">--<small>°C</small></div>
            <div class="weather-detail num" id="weather-detail">取得中...</div>
          </div>
        </div>
        <div class="laundry-box" id="laundry-box">
          <div class="laundry-label">LAUNDRY INDEX / 洗濯指数</div>
          <div class="laundry-value" id="laundry-index">算出中...</div>
        </div>
      </div>
    </section>

    <!-- =====================================
         Tier 2: 今日の予定 ＆ タスク
         ===================================== -->
    <section class="card span-7">
      <div class="card-header">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          今日の予定
        </h2>
      </div>
      <ul class="item-list" id="events-list">
        <li class="empty-msg">読み込み中...</li>
      </ul>
    </section>

    <section class="card span-5">
      <div class="card-header">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          今日のタスク
        </h2>
      </div>
      <ul class="item-list" id="tasks-list">
        <li class="empty-msg">読み込み中...</li>
      </ul>
    </section>

    <!-- =====================================
         Tier 3: 銭湯定休日 ＆ TV・ラジオ番組
         ===================================== -->
    <section class="card span-5">
      <div class="card-header">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M16 3v3a2 2 0 0 0 2 2h3"/><path d="M12 3v5"/><path d="M4 14h16v4a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-4Z"/></svg>
          本日の銭湯定休日
        </h2>
      </div>
      <div id="sento-container">
        <p class="empty-msg">読み込み中...</p>
      </div>
    </section>

    <section class="card span-7">
      <div class="card-header">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
          今日のTV・ラジオ番組
        </h2>
      </div>
      <ul class="item-list" id="media-list">
        <li class="empty-msg">読み込み中...</li>
      </ul>
    </section>

    <!-- =====================================
         Tier 4: おもなニュース ＆ 今日は何の日
         ===================================== -->
    <section class="card span-7">
      <div class="card-header">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
          おもなニュース
        </h2>
      </div>
      <ul class="news-list" id="news-list">
        <li class="empty-msg">読み込み中...</li>
      </ul>
    </section>

    <section class="card span-5">
      <div class="card-header">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          今日は何の日
        </h2>
      </div>
      <div class="anniversary-tags" id="anniversary-tags">
        <span class="empty-msg">読み込み中...</span>
      </div>
    </section>

  </main>
</div>

<script>
  /* =========================================================
     1. 設定定数（ここをご自身の環境に合わせて書き換えてください）
     ========================================================= */
  const CONFIG = {
    // GASのWebアプリURL（末尾に ?token=合言葉 を付与）
    GAS_URL: "https://script.google.com/macros/s/AKfycbxRuyGxfHaS404Y7UR3XKKQmTqtHVgZA2yVk1urUor42Fgc2R_WcsNUURzNnS8yMeu4/exec?token=mb_84k9p2m7x5v1q3w6z9",
    // localStorageの保存キー
    GAS_CACHE_KEY: "morning_briefing_gas_v1",
    WEATHER_CACHE_KEY: "morning_briefing_weather_v1",
    TODO_CHECKED_KEY: "morning_briefing_todo_checked_v1",
    // 位置情報取得失敗時のフォールバック座標（大阪市）
    FALLBACK_COORDS: { lat: 34.6937, lon: 135.5023 }
  };

  /* =========================================================
     2. 初期化・イベント登録
     ========================================================= */
  document.addEventListener("DOMContentLoaded", () => {
    renderHeaderDate();
    registerServiceWorker();
    initDashboard();

    document.getElementById("refresh-btn").addEventListener("click", () => {
      initDashboard(true);
    });

    // ToDoチェック状態の切り替え＆ローカル保持
    document.getElementById("tasks-list").addEventListener("click", (e) => {
      const li = e.target.closest(".todo-item");
      if (!li) return;
      const cb = li.querySelector("input[type='checkbox']");
      if (e.target !== cb) cb.checked = !cb.checked;
      li.classList.toggle("completed", cb.checked);
      saveTodoCheckState(li.dataset.taskId, cb.checked);
    });
  });

  function renderHeaderDate() {
    const now = new Date();
    const days = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
    const dateEl = document.getElementById("current-date");
    dateEl.innerHTML = `${now.getMonth() + 1}月${now.getDate()}日<span>${days[now.getDay()]}</span>`;
  }

  function registerServiceWorker() {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(err => {
        console.warn("Service Worker registration skipped:", err);
      });
    }
  }

  /* =========================================================
     3. ダッシュボード全体制御（キャッシュ即時表示 ＋ 裏側更新）
     ========================================================= */
  async function initDashboard(forceRefresh = false) {
    const refreshBtn = document.getElementById("refresh-btn");
    refreshBtn.disabled = true;

    // 天気・洗濯指数とGASデータを並列で処理
    await Promise.all([
      loadWeatherSection(forceRefresh),
      loadGasSection()
    ]);

    refreshBtn.disabled = false;
  }

  /* =========================================================
     4. GASデータ取得・キャッシュ・描画処理
     ========================================================= */
  async function loadGasSection() {
    const statusEl = document.getElementById("sync-status");
    const staleBanner = document.getElementById("stale-banner");
    const now = new Date();

    // 1. localStorageから前回のキャッシュを即座に復元
    const cachedRaw = localStorage.getItem(CONFIG.GAS_CACHE_KEY);
    if (cachedRaw) {
      try {
        const cached = JSON.parse(cachedRaw);
        const isToday = isSameDay(new Date(cached.savedAt), now);
        renderGasData(cached.data);
        staleBanner.style.display = isToday ? "none" : "block";
      } catch (e) {
        console.warn("GASキャッシュの復元失敗:", e);
      }
    }

    // 2. 裏側でGASから最新データを取得（Stale-While-Revalidate）
    statusEl.textContent = "同期中";
    statusEl.classList.add("is-loading");

    try {
      // 未設定時のデモ確認用（URLが初期値のままならサンプルデータを表示）
      if (CONFIG.GAS_URL.includes("デプロイID")) {
        const demoData = getDemoGasData();
        renderGasData(demoData);
        statusEl.textContent = "デモ表示";
        staleBanner.style.display = "none";
        return;
      }

      const response = await fetch(CONFIG.GAS_URL);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const freshData = await response.json();

      renderGasData(freshData);
      staleBanner.style.display = "none";

      localStorage.setItem(CONFIG.GAS_CACHE_KEY, JSON.stringify({
        savedAt: now.toISOString(),
        data: freshData
      }));

      const timeStr = now.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
      statusEl.textContent = `更新 ${timeStr}`;
    } catch (err) {
      console.error("GAS取得エラー:", err);
      statusEl.textContent = cachedRaw ? "キャッシュ表示中" : "取得エラー";
    } finally {
      statusEl.classList.remove("is-loading");
    }
  }

  /**
   * GASから返却されたJSONを各カードへ描画
   * 想定JSON構造:
   * {
   *   transit: { route: "路線名", isDelayed: false, statusText: "平常運転（遅れなし）" },
   *   events: [{ time: "14:00", title: "定例会議" }],
   *   tasks: [{ id: "1", title: "請求書確認" }],
   *   sentoClosed: ["〇〇温泉"],
   *   media: [{ time: "22:00", station: "TBSラジオ", title: "番組名" }],
   *   news: [{ title: "見出し", url: "https://..." }],
   *   anniversaries: [{ name: "記念日名", highlight: true }]
   * }
   */
  function renderGasData(data) {
    if (!data) return;

    // ① 鉄道運行情報
    const transitCard = document.getElementById("transit-card");
    const routeNameEl = document.getElementById("transit-route-name");
    const transitStatusEl = document.getElementById("transit-status");
    if (data.transit) {
      routeNameEl.textContent = data.transit.route || "通勤路線 運行状況";
      const isDelayed = Boolean(data.transit.isDelayed);
      transitCard.classList.toggle("is-delayed", isDelayed);
      transitStatusEl.innerHTML = `<span class="status-dot"></span><span>${escapeHtml(data.transit.statusText || "平常運転")}</span>`;
    }

    // ④ 今日の予定
    const eventsEl = document.getElementById("events-list");
    if (data.events && data.events.length > 0) {
      eventsEl.innerHTML = data.events.map(ev =>
        `<li><span class="time-badge num">${escapeHtml(ev.time || "終日")}</span><span>${escapeHtml(ev.title)}</span></li>`
      ).join("");
    } else {
      eventsEl.innerHTML = `<li class="empty-msg">本日の予定はありません</li>`;
    }

    // ⑤ Google ToDoタスク（ローカルのチェック状態も復元）
    const tasksEl = document.getElementById("tasks-list");
    const checkedMap = getTodoCheckState();
    if (data.tasks && data.tasks.length > 0) {
      tasksEl.innerHTML = data.tasks.map((task, idx) => {
        const id = String(task.id || idx);
        const isChecked = Boolean(checkedMap[id]);
        return `<li class="todo-item ${isChecked ? "completed" : ""}" data-task-id="${escapeHtml(id)}">
          <input type="checkbox" ${isChecked ? "checked" : ""}>
          <span>${escapeHtml(task.title)}</span>
        </li>`;
      }).join("");
    } else {
      tasksEl.innerHTML = `<li class="empty-msg">本日のタスクはありません</li>`;
    }

    // ⑥ 銭湯定休日
    const sentoContainer = document.getElementById("sento-container");
    if (data.sentoClosed && data.sentoClosed.length > 0) {
      const badges = data.sentoClosed.map(name =>
        `<span class="sento-badge">${escapeHtml(name)}（本日休業）</span>`
      ).join("");
      sentoContainer.innerHTML = `<div class="sento-list">${badges}</div>`;
    } else {
      sentoContainer.innerHTML = `<p class="sento-open-msg">登録されている銭湯はすべて営業日です</p>`;
    }

    // ⑦ TV・ラジオ番組
    const mediaEl = document.getElementById("media-list");
    if (data.media && data.media.length > 0) {
      mediaEl.innerHTML = data.media.map(m =>
        `<li>
          <span class="time-badge num">${escapeHtml(m.time)}</span>
          ${m.station ? `<span class="media-station">${escapeHtml(m.station)}</span>` : ""}
          <span>${escapeHtml(m.title)}</span>
        </li>`
      ).join("");
    } else {
      mediaEl.innerHTML = `<li class="empty-msg">本日登録されている番組はありません</li>`;
    }

    // ⑧ おもなニュース
    const newsEl = document.getElementById("news-list");
    if (data.news && data.news.length > 0) {
      newsEl.innerHTML = data.news.slice(0, 6).map(item =>
        `<li><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a></li>`
      ).join("");
    } else {
      newsEl.innerHTML = `<li class="empty-msg">ニュースを取得できませんでした</li>`;
    }

    // ⑨ 今日は何の日
    const anniEl = document.getElementById("anniversary-tags");
    if (data.anniversaries && data.anniversaries.length > 0) {
      anniEl.innerHTML = data.anniversaries.map(a => {
        const label = typeof a === "string" ? a : a.name;
        const isHighlight = typeof a === "object" && a.highlight;
        return `<span class="tag ${isHighlight ? "highlight" : ""}">${escapeHtml(label)}</span>`;
      }).join("");
    } else {
      anniEl.innerHTML = `<span class="empty-msg">記念日データなし</span>`;
    }
  }

  /* =========================================================
     5. 現在地取得 ＋ Open-Meteo 天気＆洗濯指数算出
     ========================================================= */
  async function loadWeatherSection(forceRefresh = false) {
    // 1. 直近の天気キャッシュ（1時間以内）があれば即座に表示
    const cachedRaw = localStorage.getItem(CONFIG.WEATHER_CACHE_KEY);
    if (cachedRaw) {
      try {
        const cached = JSON.parse(cachedRaw);
        renderWeatherUI(cached.data);
        const ageMinutes = (Date.now() - new Date(cached.savedAt).getTime()) / 60000;
        if (!forceRefresh && ageMinutes < 60 && isSameDay(new Date(cached.savedAt), new Date())) {
          return; // 1時間以内の当日キャッシュなら再取得をスキップ
        }
      } catch (e) {
        console.warn("天気キャッシュ復元失敗:", e);
      }
    }

    // 2. Geolocation APIから現在地を取得
    const coords = await getCurrentCoordinates();
    const cityName = await fetchCityName(coords.lat, coords.lon);

    // 3. Open-Meteo APIで天気を取得
    const apiUrl = new URL("https://api.open-meteo.com/v1/forecast");
    apiUrl.searchParams.set("latitude", coords.lat);
    apiUrl.searchParams.set("longitude", coords.lon);
    apiUrl.searchParams.set("current", "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m");
    apiUrl.searchParams.set("daily", "temperature_2m_max,temperature_2m_min,precipitation_probability_max");
    apiUrl.searchParams.set("timezone", "Asia/Tokyo");
    apiUrl.searchParams.set("forecast_days", "1");

    try {
      const res = await fetch(apiUrl.toString());
      if (!res.ok) throw new Error(`Weather HTTP ${res.status}`);
      const data = await res.json();

      const weatherPayload = {
        cityName,
        temp: Math.round(data.current.temperature_2m),
        humidity: data.current.relative_humidity_2m,
        windSpeed: data.current.wind_speed_10m,
        weatherCode: data.current.weather_code,
        maxTemp: Math.round(data.daily.temperature_2m_max[0]),
        minTemp: Math.round(data.daily.temperature_2m_min[0]),
        precipProb: data.daily.precipitation_probability_max[0]
      };

      renderWeatherUI(weatherPayload);

      localStorage.setItem(CONFIG.WEATHER_CACHE_KEY, JSON.stringify({
        savedAt: new Date().toISOString(),
        data: weatherPayload
      }));
    } catch (err) {
      console.error("天気取得エラー:", err);
      document.getElementById("weather-detail").textContent = "天気データの取得に失敗しました";
    }
  }

  function renderWeatherUI(w) {
    document.getElementById("weather-location").textContent = w.cityName;
    document.getElementById("weather-temp").innerHTML = `${w.temp}<small>°C</small>`;
    document.getElementById("weather-detail").textContent =
      `最高 ${w.maxTemp}°C / 最低 ${w.minTemp}°C ・ 降水確率 ${w.precipProb}% ・ 湿度 ${w.humidity}%`;
    document.getElementById("weather-icon").innerHTML = getWeatherSvg(w.weatherCode);

    const laundry = calculateLaundryIndex({
      weatherCode: w.weatherCode,
      precipProb: w.precipProb,
      temp: w.maxTemp,
      humidity: w.humidity,
      windSpeed: w.windSpeed
    });

    const laundryEl = document.getElementById("laundry-index");
    const laundryBox = document.getElementById("laundry-box");
    laundryEl.textContent = laundry.label;

    laundryBox.style.background = laundry.isGood ? "var(--accent-green-soft)" : "var(--accent-pink-soft)";
    laundryBox.style.borderColor = laundry.isGood ? "var(--accent-green-border)" : "var(--accent-pink-border)";
    laundryBox.querySelector(".laundry-label").style.color = laundry.isGood ? "var(--accent-green)" : "var(--accent-pink)";
  }

  function getCurrentCoordinates() {
    return new Promise((resolve) => {
      if (!("geolocation" in navigator)) {
        resolve(CONFIG.FALLBACK_COORDS);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({
          lat: Number(pos.coords.latitude.toFixed(4)),
          lon: Number(pos.coords.longitude.toFixed(4))
        }),
        () => resolve(CONFIG.FALLBACK_COORDS),
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 1800000 }
      );
    });
  }

  async function fetchCityName(lat, lon) {
    try {
      const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ja`;
      const res = await fetch(url);
      const data = await res.json();
      const pref = data.principalSubdivision || "";
      const city = data.city || data.locality || "";
      return `${pref} ${city}`.trim() || "現在地";
    } catch {
      return "現在地";
    }
  }

  function calculateLaundryIndex({ weatherCode, precipProb, temp, humidity, windSpeed }) {
    if (weatherCode >= 51 || precipProb >= 50) {
      return { label: "部屋干し推奨（雨の心配あり）", isGood: false };
    }
    if (precipProb >= 30) {
      return { label: "空模様に注意（急な雨に警戒）", isGood: false };
    }
    let score = 0;
    if (weatherCode <= 1) score += 40;
    else if (weatherCode <= 3) score += 25;

    if (humidity <= 50) score += 30;
    else if (humidity <= 65) score += 20;
    else score += 10;

    if (temp >= 20) score += 20;
    else if (temp >= 12) score += 15;
    else score += 5;

    if (windSpeed >= 10) score += 10;

    if (score >= 75) return { label: "大変よく乾く・外干し日和", isGood: true };
    if (score >= 55) return { label: "よく乾く・外干しOK", isGood: true };
    return { label: "やや乾きにくい（厚手は注意）", isGood: true };
  }

  function getWeatherSvg(code) {
    if (code <= 1) {
      return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
    }
    if (code <= 48) {
      return `<svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`;
    }
    return `<svg viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>`;
  }

  /* =========================================================
     6. ユーティリティ関数
     ========================================================= */
  function isSameDay(d1, d2) {
    return d1.getFullYear() === d2.getFullYear() &&
           d1.getMonth() === d2.getMonth() &&
           d1.getDate() === d2.getDate();
  }

  function escapeHtml(str) {
    if (str == null) return "";
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  function getTodoCheckState() {
    try {
      const raw = JSON.parse(localStorage.getItem(CONFIG.TODO_CHECKED_KEY) || "{}");
      if (raw.date && isSameDay(new Date(raw.date), new Date())) {
        return raw.checked || {};
      }
    } catch {}
    return {};
  }

  function saveTodoCheckState(taskId, isChecked) {
    const current = getTodoCheckState();
    current[taskId] = isChecked;
    localStorage.setItem(CONFIG.TODO_CHECKED_KEY, JSON.stringify({
      date: new Date().toISOString(),
      checked: current
    }));
  }

  // GAS URL未設定時に画面レイアウトを確認するためのサンプルデータ
  function getDemoGasData() {
    return {
      transit: { route: "大阪メトロ 谷町線", isDelayed: false, statusText: "平常運転（遅れなし）" },
      events: [
        { time: "終日", title: "在宅勤務" },
        { time: "14:00", title: "定例オンラインミーティング" }
      ],
      tasks: [
        { id: "demo1", title: "見積データの最終確認" },
        { id: "demo2", title: "日用品の買い出し" }
      ],
      sentoClosed: ["〇〇温泉"],
      media: [
        { time: "22:00", station: "TBSラジオ", title: "武田砂鉄のプレ金ナイト" },
        { time: "25:00", station: "NHK FM", title: "ラジオ深夜便" }
      ],
      news: [
        { title: "朝の主要ニュースヘッドライン（GAS接続後に自動更新されます）", url: "#" },
        { title: "経済・社会トピックの最新記事リンクサンプル", url: "#" }
      ],
      anniversaries: [
        { name: "将棋の日", highlight: true },
        { name: "蓮根の日", highlight: false },
        { name: "ドラフト記念日", highlight: false }
      ]
    };
  }
</script>
